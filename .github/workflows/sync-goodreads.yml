name: Sync Goodreads

on:
  schedule:
    # 23:15 UTC. The Pages cron worker at 00:00 UTC then builds main and publishes this file.
    - cron: "15 23 * * *"
  workflow_dispatch:
  push:
    # Admin "Sync now" writes this file when the GitHub token cannot dispatch workflows.
    branches: [main]
    paths:
      - .github/goodreads-sync-request

permissions:
  contents: write

concurrency:
  group: sync-goodreads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch shelves
        id: sync
        run: node scripts/sync-goodreads.mjs
        continue-on-error: true
      - name: Commit shelf updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/goodreads-live.json src/data/activity-log.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No shelf changes to commit."
            exit 0
          fi
          git commit -m "Update currently reading from Goodreads"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is not set. The 00:00 UTC Pages cron publishes main."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Triggered a Pages deploy."
      - name: Fail if Goodreads rejected the fetch
        if: steps.sync.outcome == 'failure'
        run: exit 1
