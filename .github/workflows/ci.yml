name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # Catches Astro compile/template errors on every push and PR. Uses
      # build:ci (plain `astro build`), not `build`, because the full build
      # script's prestep makes a real network call to Goodreads — not
      # something a lint/compile check should depend on.
      - run: npm run build:ci
